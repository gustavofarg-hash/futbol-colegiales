<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Confirmar partido · Mis Partidos</title>
  <meta name="theme-color" content="#0f7a3d">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      var steps = [16, 18, 20, 22, 24];
      var i = 1;
      try {
        var n = parseInt(localStorage.getItem('f7c-text-size'), 10);
        if (n >= 0 && n < steps.length) i = n;
      } catch (e) {}
      document.documentElement.style.fontSize = steps[i] + 'px';
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/confirm.js"></script>
</head>
<body class="confirm-page">
  <header class="topbar">
    <div class="brand">
      <img src="icons/favicon.svg" alt="" width="30" height="30">
      <div>
        <div class="brand-title">Mis Partidos</div>
        <div class="brand-sub">Confirmar partido</div>
      </div>
    </div>
    <div class="text-size" role="group" aria-label="Tamaño del texto">
      <button type="button" class="text-step" id="btn-text-smaller" aria-label="Achicar el texto">A−</button>
      <button type="button" class="text-step" id="btn-text-bigger" aria-label="Agrandar el texto">A+</button>
    </div>
  </header>
  <main id="confirm"><div class="loading">Cargando…</div></main>
  <noscript><p class="noscript">Esta página necesita JavaScript.</p></noscript>
</body>
</html>
