<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Partidos</title>
  <meta name="description" content="Organizá los partidos de fútbol 7 del Polideportivo Colegiales">
  <meta name="theme-color" content="#1e4fd7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#071428" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mis Partidos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png?v=f7c-v140" type="image/png" sizes="64x64">
  <link rel="icon" href="icons/icon-192.png?v=f7c-v140" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=f7c-v140">
  <script src="js/trial-boot.js"></script>
  <script>
    (function () {
      var steps = [8, 10, 12, 14, 16, 18, 20, 22, 24];
      var legacy = [16, 18, 20, 22, 24];
      var i = 5;
      try {
        var n = parseInt(localStorage.getItem('f7c-text-size'), 10);
        var byPx = steps.indexOf(n);
        if (byPx >= 0) i = byPx;
        else if (n >= 0 && n < legacy.length) i = steps.indexOf(legacy[n]);
      } catch (e) {}
      document.documentElement.style.fontSize = steps[i] + 'px';
      var logged = false;
      try { logged = !!(JSON.parse(localStorage.getItem('f7c-demo-auth') || 'null') || {}).session; } catch (e) {}
      if (!logged) document.documentElement.classList.add('signed-out');
      var h = (location.hash || '').replace(/^#\/?/, '').split('/');
      if (!logged && h[0] === 'jugador' && h[1]) document.documentElement.classList.add('anon-lock');
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="banner trial" id="trial-banner">VERSIÓN DE PRUEBA. No escribe en el Firebase de producción.</div>
  <div class="topstack" id="topstack">
  <header class="topbar">
    <button class="icon-btn back" id="btn-back" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div class="brand" id="brand">
      <img src="icons/icon-192.png?v=f7c-v140" alt="" width="42" height="42">
      <div>
        <div class="brand-title">Mis Partidos</div>
        <div class="brand-sub" id="venue-name">Agenda de partidos</div>
      </div>
    </div>
    <div class="text-size" role="group" aria-label="Tamaño del texto">
      <button type="button" class="text-step" id="btn-text-smaller" aria-label="Achicar el texto">A−</button>
      <button type="button" class="text-step" id="btn-text-bigger" aria-label="Agrandar el texto">A+</button>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div id="tab-slot">
    <nav class="tabbar" id="tabbar" aria-label="Secciones">
      <a href="#/" id="tab-proximos" data-tab="home"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M3.5 10h17"/></svg><span class="tab-label">Próximos</span></a>
      <a href="#/jugadores" id="btn-roster" data-tab="roster"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.6-3 2.8-4.5 5.5-4.5S14 16 14.5 19"/><circle cx="16.5" cy="9" r="2.2"/><path d="M15 14.7c1.4-.3 2.8.2 3.8 1.5.8 1 1.1 2.2 1.2 2.8"/></svg><span class="tab-label">Jugadores</span></a>
      <a href="#/historial" id="btn-historial" data-tab="history"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg><span class="tab-label">Historial</span></a>
      <a href="#/estadisticas" id="btn-estadisticas" data-tab="stats"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10M10 19V5M15 19v-7M20 19V8"/></svg><span class="tab-label">Estadísticas</span></a>
      <a href="#/registro" id="btn-registro" data-tab="registro"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="12" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span class="tab-label">Registro</span></a>
    </nav>
  </div>
  </div>
  <script>
    if (document.documentElement.classList.contains('signed-out')) {
      var stack = document.getElementById('topstack');
      if (stack) { stack.inert = true; stack.setAttribute('aria-hidden', 'true'); }
    }
  </script>

  <div class="banner demo" id="demo-banner" hidden>
    <strong>Modo demo:</strong> los datos no se comparten todavía.
  </div>
  <div class="banner error" id="error-banner" hidden></div>
  <button type="button" class="banner activity" id="activity-banner" hidden></button>

  <main id="view" aria-live="polite">
    <div class="loading">Cargando…</div>
  </main>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="ask" class="ask"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <noscript><p class="noscript">Esta app necesita JavaScript.</p></noscript>
</body>
</html>
