<!doctype html>

  <meta name="theme-color" content="#0f7a3d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1510" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fútbol 7">
  <link rel="manifest" href="manifest.webmanifest">

  <script type="module" src="js/app.js"></script>

<body>
  <header class="topbar">
    <button class="icon-btn back" id="btn-back" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div class="brand" id="brand">
      <img src="icons/favicon.svg" alt="" width="30" height="30">
      <div>
        <div class="brand-title">Fútbol 7</div>
        <div class="brand-sub" id="venue-name">Polideportivo Colegiales</div>
      </div>
    </div>
    <button class="who-chip" id="btn-who" aria-label="Cambiar organizador" hidden></button>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="banner demo" id="demo-banner" hidden>
    <strong>Modo demo:</strong> los datos no se comparten todavía.
  </div>
  <div class="banner error" id="error-banner" hidden></div>

  <main id="view" aria-live="polite">
    <div class="loading">Cargando…</div>
  </main>

  <dialog id="sheet" class="sheet"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <noscript><p class="noscript">Esta app necesita JavaScript.</p></noscript>
</body>
</html>
